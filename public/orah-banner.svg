<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="celestial-core" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fff4cc" stop-opacity="1" />
      <stop offset="15%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#b45309" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#1e1b4b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#07080f" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="gold-shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="cross-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.3" />
    </linearGradient>

    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmos Canvas -->
  <rect width="1600" height="960" fill="#07080f" />
  <rect width="1600" height="960" fill="url(#celestial-core)" />

  <!-- Geometric Radiant Rays -->
  <g opacity="0.3" stroke="url(#gold-shimmer)" stroke-width="1.5">
    <line x1="800" y1="420" x2="0" y2="0" stroke-dasharray="10 20" />
    <line x1="800" y1="420" x2="400" y2="0" stroke-dasharray="8 15" />
    <line x1="800" y1="420" x2="800" y2="0" />
    <line x1="800" y1="420" x2="1200" y2="0" stroke-dasharray="8 15" />
    <line x1="800" y1="420" x2="1600" y2="0" stroke-dasharray="10 20" />
    <line x1="800" y1="420" x2="1600" y2="480" stroke-dasharray="5 10" />
    <line x1="800" y1="420" x2="1600" y2="960" stroke-dasharray="10 20" />
    <line x1="800" y1="420" x2="800" y2="960" />
    <line x1="800" y1="420" x2="0" y2="960" stroke-dasharray="10 20" />
    <line x1="800" y1="420" x2="0" y2="480" stroke-dasharray="5 10" />
  </g>

  <!-- Concentric Radiant Rings -->
  <g opacity="0.4" fill="none" stroke="url(#gold-shimmer)">
    <circle cx="800" cy="420" r="140" stroke-width="1" stroke-dasharray="4 8" />
    <circle cx="800" cy="420" r="240" stroke-width="1.5" stroke-dasharray="2 12" />
    <circle cx="800" cy="420" r="380" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="800" cy="420" r="540" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="6 18" />
  </g>

  <!-- Central Radiant Cross of Light -->
  <g filter="url(#glow-heavy)" opacity="0.85">
    <!-- Vertical beam -->
    <rect x="793" y="160" width="14" height="420" rx="7" fill="url(#cross-glow)" />
    <!-- Horizontal beam -->
    <rect x="670" y="270" width="260" height="14" rx="7" fill="url(#cross-glow)" />
    <!-- Center aura -->
    <circle cx="800" cy="277" r="28" fill="#ffffff" opacity="0.9" filter="url(#glow-subtle)" />
  </g>

  <!-- Floating Sacred Stars / Constellations -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="280" cy="180" r="2.5" />
    <circle cx="420" cy="240" r="1.5" opacity="0.6" />
    <circle cx="340" cy="380" r="3" />
    <circle cx="1280" cy="210" r="2.5" />
    <circle cx="1390" cy="340" r="2" opacity="0.7" />
    <circle cx="1180" cy="390" r="3.5" />
    <circle cx="210" cy="720" r="2" />
    <circle cx="460" cy="810" r="2.5" />
    <circle cx="1140" cy="760" r="2.5" />
    <circle cx="1360" cy="790" r="3" />
  </g>

  <!-- Title & Sacred Typography -->
  <g text-anchor="middle" font-family="'Playfair Display', serif, system-ui">
    <!-- Subtitle Badge -->
    <text x="800" y="620" font-size="20" letter-spacing="10" fill="#fef08a" font-weight="600" opacity="0.95">
      JESUS YOUTH PALA PRESENTS
    </text>

    <!-- Main Title -->
    <text x="800" y="730" font-size="110" font-weight="900" letter-spacing="18" fill="url(#gold-shimmer)" filter="url(#glow-subtle)">
      ORAH 2026
    </text>

    <!-- Spiritual Tagline -->
    <text x="800" y="785" font-size="24" letter-spacing="8" fill="#e2e8f0" font-weight="300" opacity="0.9">
      ARISE, SHINE, FOR YOUR LIGHT HAS COME
    </text>

    <!-- Date and Venue -->
    <text x="800" y="840" font-size="16" letter-spacing="6" fill="#94a3b8" font-family="'Geist', sans-serif" font-weight="500">
      DECEMBER 2026 • PALA, KERALA • A SACRED MISSIONARY JOURNEY
    </text>
  </g>

  <!-- Frame Accents -->
  <rect x="40" y="40" width="1520" height="880" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1" />
  <rect x="52" y="52" width="1496" height="856" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" stroke-dasharray="8 8" />
  
  <!-- Corner Accents -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#f59e0b" stroke-width="2.5" />
  <path d="M 1560 70 L 1560 40 L 1530 40" fill="none" stroke="#f59e0b" stroke-width="2.5" />
  <path d="M 40 890 L 40 920 L 70 920" fill="none" stroke="#f59e0b" stroke-width="2.5" />
  <path d="M 1560 890 L 1560 920 L 1530 920" fill="none" stroke="#f59e0b" stroke-width="2.5" />
</svg>

